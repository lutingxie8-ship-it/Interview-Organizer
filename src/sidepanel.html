<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面经清单</title><link rel="stylesheet" href="sidepanel.css"></head><body><main><header><div><h1>面经清单</h1><p id="source">当前帖子</p></div><div class="header-actions"><button id="aiSettings" class="ghost-button" title="AI 设置">⚙</button><button id="extract">重新提取</button></div></header><div class="layout"><aside id="categoryNav"></aside><section class="workspace"><div class="toolbar"><input id="filter" placeholder="筛选当前分类的问题"><button id="classify" class="ai-button">✦ AI 分类</button><span id="count"></span></div><div id="aiStatus" class="ai-status"></div><ul id="list"></ul><div id="empty">暂无题目，请打开一篇小红书面经帖子。</div></section></div></main><dialog id="settingsDialog"><form method="dialog" id="settingsForm"><div class="dialog-title"><div><h2>AI 分类设置</h2><p>用于判断通用问题和项目深挖问题</p></div><button value="cancel" class="close-button">×</button></div><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="sk-..."></label><label>接口地址<input id="apiEndpoint" value="https://apihub.agnes-ai.com/v1/chat/completions"></label><label>模型<input id="apiModel" value="agnes-2.5-flash"></label><div class="security-note">API Key 只保存在本地浏览器存储。浏览器插件直连模型存在泄露风险，请不要在公共电脑上使用。</div><div class="dialog-actions"><button value="cancel" class="cancel-button">取消</button><button id="saveSettings" value="default">保存设置</button></div></form></dialog><script src="sidepanel.js"></script></body></html>
